# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Bedingte Wiederholung
  en: Condition-controlled loop
description:
  de: "Mit „solange … tue“ wiederholt Kiko Blöcke, solange eine Bedingung wahr ist, auch wenn niemand vorher weiß, wie oft."
  en: "With “while … do” Kiko repeats blocks as long as a condition is true, even when nobody knows beforehand how often."
competencies: [wiederholung-mit-bedingung]
blocks:
  - type: section
    id: einstieg
    title:
      de: Gänge ohne bekannte Länge
      en: Corridors of unknown length
    blocks:
      - type: text
        text:
          de: |-
            Im Klassenchat der 7b:

            **Selin:** In meinem Labyrinth ist jeder Gang anders lang. Mit „wiederhole … mal“ klappt es immer nur bei einem.

            **Ali:** Kiko soll einfach laufen, bis die Wand kommt.

            **Frau Berg:** Genau dafür gibt es „solange … tue“.

            Hier lernst du, wie Kiko wiederholt, solange eine Bedingung wahr ist.
          en: |-
            In class 7b's group chat:

            **Selin:** In my maze every corridor has a different length. With “repeat … times” it only ever works for one of them.

            **Ali:** Kiko should just walk until the wall comes.

            **Frau Berg:** That's exactly what “while … do” is for.

            Here you learn how Kiko repeats as long as a condition is true.
      - type: single-choice
        id: welche-schleife
        text:
          de: Kiko soll in jedem Gang bis kurz vor die Wand laufen, egal wie lang der Gang ist. Welches Programm klappt immer?
          en: Kiko has to walk up to just before the wall in every corridor, however long the corridor is. Which program always works?
        options:
          - text: { de: "solange Weg frei? tue gehe vorwärts", en: "while way ahead clear? do move forward" }
            correct: true
            info:
              de: Vor jedem Schritt prüft Kiko, ob frei ist. Kommt die Wand, hört er auf, egal nach wie vielen Feldern.
              en: Before every step Kiko checks whether the way is clear. When the wall comes, it stops, however many squares it took.
          - text: { de: "wiederhole 5 mal: gehe vorwärts", en: "repeat 5 times: move forward" }
            correct: false
            info:
              de: Das klappt nur bei einem Gang mit genau 5 freien Feldern. Bei einem kürzeren läuft Kiko gegen die Wand.
              en: That only works in a corridor with exactly 5 free squares. In a shorter one Kiko walks into the wall.
          - text: { de: "wenn Weg frei? dann gehe vorwärts", en: "if way ahead clear? then move forward" }
            correct: false
            info:
              de: Eine Verzweigung prüft nur einmal. Kiko geht höchstens ein Feld.
              en: Selection only checks once. Kiko moves one square at most.
          - text: { de: "solange Wand voraus? tue gehe vorwärts", en: "while wall ahead? do move forward" }
            correct: false
            info:
              de: Die Bedingung ist verkehrt herum. Ist frei, ist sie falsch, und Kiko geht gar nicht los.
              en: The condition is the wrong way round. If the way is clear, it is false, and Kiko doesn't start at all.
        explanation:
          de: Wenn niemand vorher weiß, wie oft, hilft eine Schleife mit Bedingung statt mit Zahl.
          en: When nobody knows beforehand how often, a loop with a condition helps instead of one with a number.
  - type: section
    id: idee
    title:
      de: Wiederholen, solange die Bedingung wahr ist
      en: Repeating while the condition is true
    blocks:
      - type: figure
        image:
          de: images/kiko-bedingt-programm-de.svg
          en: images/kiko-bedingt-programm-en.svg
        alt:
          de: "Ein Programm: solange Weg frei? tue, darin gehe vorwärts."
          en: "A program: while way ahead clear? do, inside it move forward."
        caption:
          de: Kiko läuft, solange vor ihm frei ist.
          en: Kiko keeps walking while the way ahead is clear.
        source:
          de: eigene Zeichnung nach lernapps.net/coding
          en: own drawing after lernapps.net/coding
        licence: CC-BY-4.0
      - type: definition
        term:
          de: bedingte Wiederholung
          en: condition-controlled loop
        explanation:
          de: Eine bedingte Wiederholung führt den Schleifenrumpf aus, solange die Bedingung wahr ist. Kiko prüft die Bedingung vor jedem Durchlauf. Ist sie falsch, hört die Wiederholung auf, auch schon vor dem ersten Durchlauf.
          en: A condition-controlled loop runs the loop body while the condition is true. Kiko checks the condition before each pass; if it is false, the loop stops, even before the first pass.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: >-
                Geprüft wird nur vor jedem Durchlauf, nicht mitten im Rumpf. „Lauf, bis du am Ziel bist“ schreibst du so:
                solange nicht am Ziel? tue gehe vorwärts. Wird die
                Bedingung nie falsch, endet die Schleife nie. Das ist eine Endlosschleife. Ein Programm, das nie endet,
                löst keine Aufgabe, die enden soll.
              en: >-
                The condition is only checked before each pass, not in the middle of the body. The task “walk to the goal”
                is written like this: while not at the goal? do move forward. If the
                condition never becomes false, the loop never ends. That is an infinite loop. A program that never ends
                doesn't solve a task that is meant to end.
  - type: section
    id: ausprobieren
    title:
      de: Selbst ausprobieren
      en: Try it yourself
    blocks:
      - type: text
        text:
