  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: generated
        id: wie-oft-vorwaerts
        given:
          d: { int: [2, 10] }
        task:
          text:
            de: "Programm: solange Weg frei? tue gehe vorwärts. Vor Kiko liegen {{d}} freie Felder, dann kommt eine Wand. Wie oft geht Kiko vorwärts?"
            en: "Program: while way ahead clear? do move forward. In front of Kiko there are {{d}} free squares, then a wall. How many times does Kiko move forward?"
        answer: { value: "d", compare: { number: { format: integer } } }
        mistakes:
          - value: "d + 1"
            message:
              de: Vor der Wand ist die Bedingung falsch, dann hört Kiko auf. Gegen die Wand läuft er nicht.
              en: In front of the wall the condition is false, so Kiko stops. It doesn't walk into the wall.
          - value: "d - 1"
            message:
              de: Auch auf das letzte freie Feld darf Kiko noch gehen. Erst danach ist die Wand direkt vor ihm.
              en: Kiko may still move onto the last free square. Only then is the wall directly in front of it.
        hint:
          de: Spiel es für 2 freie Felder durch. Wie oft ist der Weg frei?
          en: Play it through for 2 free squares. How often is the way clear?
        steps:
          - de: "Vor jedem der {{d}} freien Felder ist der Weg frei: Kiko geht vorwärts."
            en: "Before each of the {{d}} free squares the way is clear: Kiko moves forward."
          - de: "Danach ist die Wand voraus, die Bedingung ist falsch. Kiko ging {{answer}}-mal vorwärts."
            en: "After that the wall is ahead and the condition is false. Kiko moved forward {{answer}} times."
      - type: generated
        id: wie-oft-pruefen
        given:
          d: { int: [2, 10] }
        task:
          text:
            de: "Programm: solange Weg frei? tue gehe vorwärts. Vor Kiko liegen {{d}} freie Felder, dann eine Wand. Wie oft prüft Kiko die Bedingung „Weg frei?“?"
            en: "Program: while way ahead clear? do move forward. In front of Kiko there are {{d}} free squares, then a wall. How many times does Kiko check the condition “way ahead clear?”?"
        answer: { value: "d + 1", compare: { number: { format: integer } } }
        mistakes:
          - value: "d"
            message:
              de: Du hast die letzte Prüfung vergessen. Vor der Wand fragt Kiko noch einmal und bekommt falsch, erst dann hört er auf.
              en: You forgot the last check. In front of the wall Kiko asks once more and gets false; only then does it stop.
        hint:
          de: Kiko prüft vor jedem Durchlauf und einmal am Ende, wenn die Antwort falsch ist.
          en: Kiko checks before every pass and once at the end, when the answer is false.
        steps:
          - de: "{{d}} Prüfungen mit der Antwort wahr, jedes Mal geht Kiko ein Feld."
            en: "{{d}} checks with the answer true, each time Kiko moves one square."
          - de: "Dazu 1 Prüfung mit der Antwort falsch: zusammen {{answer}}."
            en: "Plus 1 check with the answer false: {{answer}} in all."
      - type: true-false
        id: endlosschleife
        text:
          de: Kiko steht nicht am Ziel und führt dieses Programm aus. Stimmt es, dass das Programm nie endet?
          en: Kiko is not on the goal and carries out this program. Is it true that the program never ends?
        material:
          - type: figure
            image:
              de: images/kiko-bedingt-endlos-de.svg
              en: images/kiko-bedingt-endlos-en.svg
            alt:
              de: "Ein Programm: solange nicht am Ziel? tue, darin drehe dich nach links."
              en: "A program: while not at the goal? do, inside it turn left."
            caption:
              de: Ein Programm mit bedingter Wiederholung
              en: A program with a condition-controlled loop
            source:
              de: eigene Zeichnung nach lernapps.net/coding
              en: own drawing after lernapps.net/coding
            licence: CC-BY-4.0
        answer: true
        explanation:
          de: Beim Drehen bleibt Kiko auf seinem Feld und kommt nie ans Ziel. Die Bedingung bleibt wahr, das ist eine Endlosschleife.
          en: When turning, Kiko stays on its square and never reaches the goal. The condition stays true; that is an infinite loop.
      - type: matching
        id: zahl-oder-bedingung
        text:
          de: Welche Schleife passt zu welcher Aufgabe?
          en: Which loop fits which task?
        pairs:
          - left: { de: Kiko soll genau 6 Felder gehen., en: Kiko has to move exactly 6 squares. }
            right: { de: "wiederhole 6 mal: gehe vorwärts", en: "repeat 6 times: move forward" }
          - left: { de: Kiko soll bis zur Wand gehen., en: Kiko has to move up to the wall. }
            right: { de: "solange Weg frei? tue gehe vorwärts", en: "while way ahead clear? do move forward" }
          - left:
              de: "Kiko soll sich drehen, bis er am Ziel ist."
              en: "Kiko has to turn until it is at the goal."
            right:
              de: "Keine Schleife hilft: Drehen bringt ihn nicht ans Ziel."
              en: "No loop helps: turning doesn't get it to the goal."
        explanation:
          de: Ist die Anzahl bekannt, passt die Zählschleife. Hängt sie vom Spielfeld ab, passt die bedingte Wiederholung. Ändert der Rumpf nichts an der Bedingung, wird sie nie falsch, und die Schleife endet nie.
          en: If the number is known, the count-controlled loop fits. If it depends on the board, the condition-controlled loop fits. If the body changes nothing about the condition, it never becomes false, and the loop never ends.
  - type: section
    id: weiter
    title:
      de: Rückblick und wie es weitergeht
      en: Looking back and what comes next
    blocks:
      - type: text
        text:
          de: >-
            In diesem Kapitel hast du Programme aus Blöcken gebaut und debuggt, Kiko mit Verzweigungen entscheiden und
            mit Schleifen wiederholen lassen. **Selin** schreibt: „Kiko findet jetzt durch mein ganzes Labyrinth! 🎉“
            Später, in Klasse 9 und 10, schreibst du dieselben Programme als Struktogramm, als Pseudocode und als Text.
          en: >-
            In this chapter you built and debugged programs from blocks and let Kiko decide with selection and repeat
            with loops. **Selin** writes: “Kiko now finds its way through my whole maze! 🎉” Later, in grades 9 and 10,
            you write the same programs as a Nassi-Shneiderman diagram, as pseudocode and as text.
