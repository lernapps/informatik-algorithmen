  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: generated
        id: befehle-zaehlen
        given:
          n: { int: [2, 9] }
          k: { int: [2, 4] }
        where: ["n * k != n + k"]
        task:
          text:
            de: "Im Schleifenrumpf von „wiederhole {{n}} mal“ stehen {{k}} Befehle. Wie viele Befehle führt Kiko insgesamt aus?"
            en: "The loop body of “repeat {{n}} times” holds {{k}} commands. How many commands does Kiko carry out in total?"
        answer: { value: "n * k", compare: { number: { format: integer } } }
        mistakes:
          - value: "n + k"
            message:
              de: Du hast addiert. In jedem der {{n}} Durchläufe führt Kiko alle {{k}} Befehle aus, also malnehmen.
              en: You added. In each of the {{n}} passes Kiko carries out all {{k}} commands, so multiply.
          - value: "k"
            message:
              de: Das ist nur ein Durchlauf. Die Schleife läuft {{n}}-mal.
              en: That is only one pass. The loop runs {{n}} times.
        hint:
          de: Wie viele Befehle sind es in einem Durchlauf? Und wie viele Durchläufe gibt es?
          en: How many commands are there in one pass? And how many passes are there?
        steps:
          - de: "Ein Durchlauf: {{k}} Befehle."
            en: "One pass: {{k}} commands."
          - de: "{{n}} Durchläufe: {{n}} · {{k}} = {{answer}} Befehle."
            en: "{{n}} passes: {{n}} · {{k}} = {{answer}} commands."
      - type: generated
        id: wie-oft-wiederholen
        given:
          d: { int: [3, 11] }
        task:
          text:
            de: "Kiko steht am Anfang eines geraden Gangs und schaut zum Ziel. Zählst du die Felder von Kiko bis zum Ziel, das Ziel mit, aber Kikos Feld nicht, sind es {{d}}. Welche Zahl gehört in „wiederhole … mal: gehe vorwärts“?"
            en: "Kiko stands at the start of a straight corridor, facing the goal. If you count the squares from Kiko to the goal, including the goal but not Kiko's square, there are {{d}}. Which number goes into “repeat … times: move forward”?"
        answer: { value: "d", compare: { number: { format: integer } } }
        mistakes:
          - value: "d + 1"
            message:
              de: Du hast Kikos eigenes Feld mitgezählt. Dorthin muss er nicht gehen.
              en: You counted Kiko's own square. It doesn't have to move there.
          - value: "d - 1"
            message:
              de: Das Ziel zählt mit. Kiko muss auch auf das Zielfeld gehen.
              en: The goal counts. Kiko also has to move onto the goal square.
        hint:
          de: Jedes „gehe vorwärts“ bringt Kiko genau ein Feld weiter.
          en: Each “move forward” takes Kiko exactly one square further.
        steps:
          - de: "Kiko muss {{d}} Felder gehen, jedes mit einem „gehe vorwärts“."
            en: "Kiko has to move {{d}} squares, each with one “move forward”."
          - de: "Also: wiederhole {{answer}} mal gehe vorwärts."
            en: "So: repeat {{answer}} times move forward."
      - type: matching
        id: sequenz-zu-schleife
        text:
          de: Welche Zählschleife macht dasselbe wie die Befehlsfolge?
          en: Which count-controlled loop does the same as the sequence of commands?
        pairs:
          - left: { de: "vorwärts, vorwärts, vorwärts", en: "forward, forward, forward" }
            right: { de: "wiederhole 3 mal: vorwärts", en: "repeat 3 times: forward" }
          - left: { de: "rechts, rechts", en: "right, right" }
            right: { de: "wiederhole 2 mal: rechts", en: "repeat 2 times: right" }
          - left: { de: "vorwärts, links, vorwärts, links", en: "forward, left, forward, left" }
            right: { de: "wiederhole 2 mal: vorwärts, links", en: "repeat 2 times: forward, left" }
          - left:
              de: "vorwärts, vorwärts, links, vorwärts, vorwärts, links"
              en: "forward, forward, left, forward, forward, left"
            right: { de: "wiederhole 2 mal: vorwärts, vorwärts, links", en: "repeat 2 times: forward, forward, left" }
        distractors:
          - { de: "wiederhole 3 mal: vorwärts, links", en: "repeat 3 times: forward, left" }
        explanation:
          de: Such das Stück, das sich wiederholt. Das wird der Schleifenrumpf, und die Zahl sagt, wie oft es vorkommt.
          en: Look for the part that repeats. That becomes the loop body, and the number says how often it occurs.
      - type: true-false
        id: rumpf-reihenfolge
        text:
          de: "Selin sagt: „Bei ‚wiederhole 3 mal: vorwärts, links‘ geht Kiko erst 3-mal vorwärts und dreht sich dann 3-mal.“ Stimmt das?"
          en: "Selin says: “With ‘repeat 3 times: forward, left’ Kiko first moves forward 3 times and then turns 3 times.” Is that true?"
        answer: false
        explanation:
          de: "In jedem Durchlauf führt Kiko den ganzen Rumpf aus: vorwärts, links, vorwärts, links, vorwärts, links."
          en: "In every pass Kiko carries out the whole body: forward, left, forward, left, forward, left."
  - type: section
    id: weiter
    title:
      de: Wie es weitergeht
      en: What comes next
    blocks:
      - type: text
        text:
          de: >-
            Du kannst jetzt mit einer Zählschleife Blöcke mehrmals ausführen lassen. **Selin** schreibt: „Mein
            Labyrinth hat Gänge, die jedes Mal anders lang sind. Welche Zahl soll ich da eintragen?“ Auf der nächsten
            Seite wiederholt Kiko, ohne vorher zu zählen.
          en: >-
            You can now make blocks run several times with a count-controlled loop. **Selin** writes: “My maze has
            corridors that are a different length each time. Which number should I put in?” On the next page Kiko
            repeats without counting first.
