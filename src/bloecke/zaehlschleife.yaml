# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Zählschleife
  en: Count-controlled loop
description:
  de: "Mit „wiederhole … mal“ führt Kiko Blöcke mehrmals aus: kürzere Programme für lange Wege und Muster."
  en: "With “repeat … times” Kiko carries out blocks several times: shorter programs for long paths and patterns."
competencies: [wiederholung-feste-anzahl]
blocks:
  - type: section
    id: einstieg
    title:
      de: Neunmal derselbe Block
      en: The same block nine times
    blocks:
      - type: text
        text:
          de: |-
            Im Klassenchat der 7b:

            **Jona:** Mein Gang ist 9 Felder lang. Ich hab 9-mal „gehe vorwärts“ gezogen 😩

            **Selin:** Nimm „wiederhole … mal“. Dann reicht ein „gehe vorwärts“.

            **Jona:** Und wie oft wiederholt Kiko?

            Hier lernst du, wie Kiko Blöcke mit einer Zählschleife mehrmals ausführt.
          en: |-
            In class 7b's group chat:

            **Jona:** My corridor is 9 squares long. I dragged “move forward” 9 times 😩

            **Selin:** Use “repeat … times”. Then one “move forward” is enough.

            **Jona:** And how often does Kiko repeat?

            Here you learn how Kiko carries out blocks several times with a count-controlled loop.
      - type: single-choice
        id: wo-nach-schleife
        text:
          de: Kiko schaut im Bild nach rechts und führt das Programm mit der Schleife aus. Auf welchem Feld endet er?
          en: Kiko faces right on the board and carries out the program with the loop. Which square does it end on?
        material:
          - type: figure
            image:
              de: images/kiko-zaehlschleife-programm-de.svg
              en: images/kiko-zaehlschleife-programm-en.svg
            alt:
              de: "Ein Programm: wiederhole 2 mal, darin: gehe vorwärts, gehe vorwärts, drehe dich nach links."
              en: "A program: repeat 2 times, inside: move forward, move forward, turn left."
            caption:
              de: Das Programm. Die drei Blöcke stehen in der Schleife.
              en: The program. The three blocks are inside the loop.
            source:
              de: eigene Zeichnung nach lernapps.net/coding
              en: own drawing after lernapps.net/coding
            licence: CC-BY-4.0
          - type: figure
            image: images/kiko-zaehlschleife-wo.svg
            alt:
              de: "Ein Spielfeld mit Spalten 1 bis 7 und Zeilen 1 bis 7. Kiko steht in Spalte 2, Zeile 6 und schaut im Bild nach rechts. Markiert sind A in Spalte 2, Zeile 4; B in Spalte 4, Zeile 6; C in Spalte 4, Zeile 4; D in Spalte 6, Zeile 6."
              en: "A board with columns 1 to 7 and rows 1 to 7. Kiko stands in column 2, row 6 and faces right on the board. Marked are A in column 2, row 4; B in column 4, row 6; C in column 4, row 4; D in column 6, row 6."
            caption:
              de: Das Spielfeld
              en: The board
            source:
              de: eigene Zeichnung, Kiko nach lernapps.net/coding
              en: own drawing, Kiko after lernapps.net/coding
            licence: CC-BY-4.0
        options:
          - text: { de: Feld A, en: Square A }
            correct: false
            info:
              de: So wäre es nach drei Durchläufen. Die Schleife läuft aber nur 2-mal.
              en: That would be after three passes. But the loop only runs 2 times.
          - text: { de: Feld B, en: Square B }
            correct: false
            info:
              de: Das ist das Ende des ersten Durchlaufs. Danach läuft die Schleife noch ein zweites Mal.
              en: That is the end of the first pass. After it the loop runs a second time.
          - text: { de: Feld C, en: Square C }
            correct: true
            info:
              de: "Richtig: Erster Durchlauf 2 Felder nach rechts, links drehen. Zweiter Durchlauf 2 Felder hoch, links drehen."
              en: "Right: first pass 2 squares to the right, turn left. Second pass 2 squares up, turn left."
          - text: { de: Feld D, en: Square D }
            correct: false
            info:
              de: Du hast die Drehungen übersehen. Nach jedem Durchlauf dreht Kiko sich nach links.
              en: You overlooked the turns. After every pass Kiko turns left.
        explanation:
          de: Kiko führt den ganzen Inhalt der Schleife aus, dann noch einmal. Nach 2 Durchläufen steht er in Spalte 4, Zeile 4.
          en: Kiko carries out everything inside the loop, then once more. After 2 passes it is in column 4, row 4.
  - type: section
    id: idee
    title:
      de: Wiederholen mit fester Anzahl
      en: Repeating a fixed number of times
    blocks:
      - type: figure
        image:
          de: images/kiko-zaehlschleife-lang-de.svg
          en: images/kiko-zaehlschleife-lang-en.svg
        alt:
          de: Ein Programm aus neun Blöcken „gehe vorwärts“ untereinander.
          en: A program of nine “move forward” blocks one below the other.
        caption:
          de: Jonas Programm mit 9 Blöcken
          en: Jona's program with 9 blocks
        source:
          de: eigene Zeichnung nach lernapps.net/coding
          en: own drawing after lernapps.net/coding
        licence: CC-BY-4.0
      - type: figure
        image:
          de: images/kiko-zaehlschleife-kurz-de.svg
          en: images/kiko-zaehlschleife-kurz-en.svg
        alt:
          de: "Ein Programm aus zwei Blöcken: wiederhole 9 mal, darin gehe vorwärts."
          en: "A program of two blocks: repeat 9 times, inside it move forward."
        caption:
          de: Selins Programm mit 2 Blöcken. Kiko läuft genauso weit.
          en: Selin's program with 2 blocks. Kiko goes just as far.
        source:
          de: eigene Zeichnung nach lernapps.net/coding
          en: own drawing after lernapps.net/coding
        licence: CC-BY-4.0
      - type: definition
        term:
          de: Zählschleife
          en: count-controlled loop
        explanation:
          de: Eine Zählschleife (Wiederholung mit fester Anzahl) führt ihren Schleifenrumpf so oft aus, wie die Zahl sagt.
          en: A count-controlled loop runs its loop body as many times as the number says.
      - type: definition
        term:
          de: Schleifenrumpf
          en: loop body
        explanation:
          de: Der Schleifenrumpf sind die Blöcke in der Schleife. Er ist eine Sequenz, die mehrmals ausgeführt wird.
          en: The loop body is the blocks inside the loop. It is a sequence that is carried out several times.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: >-
                Zähl die Felder, die Kiko gehen soll. Sein eigenes Feld zählt nicht mit. In einem Durchlauf führt Kiko
                den ganzen Rumpf aus, von oben nach unten, erst dann beginnt der nächste.
              en: >-
                Count the squares Kiko has to move. Its own square doesn't count. In one pass Kiko carries out the
                whole body, from top to bottom; only then does the next pass begin.
  - type: section
    id: ausprobieren
    title:
      de: Selbst ausprobieren
      en: Try it yourself
