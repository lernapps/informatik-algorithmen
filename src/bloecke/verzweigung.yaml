  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: number
        id: spielfeld-a-felder
        text:
          de: "Kiko führt dieses Programm auf einem freien Gang aus, vor ihm ist keine Wand: wenn Wand voraus? dann drehe dich nach rechts, sonst gehe vorwärts. Danach: gehe vorwärts. Wie viele Felder geht Kiko?"
          en: "Kiko carries out this program in a free corridor with no wall in front of it: if wall ahead? then turn right, else move forward. After that: move forward. How many squares does Kiko move?"
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 1
            message:
              de: Der „sonst“-Zweig bringt ein Feld, der Block nach der Verzweigung noch eins.
              en: The “else” branch gives one square, the block after the selection one more.
          - answer: 0
            message:
              de: Ohne Wand ist die Bedingung falsch. Dann dreht Kiko sich nicht, sondern geht vorwärts.
              en: Without a wall the condition is false. Then Kiko doesn't turn but moves forward.
        explanation:
          de: "Keine Wand voraus: Kiko nimmt den „sonst“-Zweig und geht ein Feld. Der Block nach der Verzweigung bringt ihn ein zweites Feld weiter."
          en: "No wall ahead: Kiko takes the “else” branch and moves one square. The block after the selection takes it one more square."
      - type: matching
        id: welcher-zweig
        text:
          de: "Programm: wenn Weg frei? dann gehe vorwärts, sonst drehe dich nach links. Was tut Kiko?"
          en: "Program: if way ahead clear? then move forward, else turn left. What does Kiko do?"
        pairs:
          - left: { de: Vor Kiko ist frei., en: The way ahead of Kiko is clear. }
            right: { de: Er geht ein Feld vorwärts., en: It moves one square forward. }
          - left: { de: Vor Kiko ist eine Wand., en: There is a wall in front of Kiko. }
            right: { de: Er dreht sich nach links., en: It turns left. }
        distractors:
          - { de: Er geht vorwärts und dreht sich dann nach links., en: It moves forward and then turns left. }
          - { de: Er bleibt stehen und macht nichts., en: It stands still and does nothing. }
        explanation:
          de: Ist der Weg frei, gilt „dann“, sonst gilt „sonst“. Beide Zweige zusammen kommen nie vor.
          en: If the way is clear, “then” applies, otherwise “else”. Both branches together never happen.
      - type: multiple-choice
        id: was-ist-bedingung
        text:
          de: Welche dieser Blöcke sind Bedingungen, auf die es nur wahr oder falsch gibt?
          en: Which of these blocks are conditions that can only be true or false?
        options:
          - text: { de: „Wand voraus?“, en: “wall ahead?” }
            correct: true
            info:
              de: Entweder ist eine Wand vor Kiko oder nicht.
              en: Either there is a wall in front of Kiko or there isn't.
          - text: { de: „am Ziel?“, en: “at the goal?” }
            correct: true
            info:
              de: Kiko steht auf dem Ziel oder nicht. Auch das ist wahr oder falsch.
              en: Kiko is on the goal or not. That is true or false too.
          - text: { de: „gehe vorwärts“, en: “move forward” }
            correct: false
            info:
              de: Das ist ein Befehl. Kiko tut etwas, er fragt nichts.
              en: That is a command. Kiko does something; it doesn't ask anything.
          - text: { de: „Weg frei?“, en: “way ahead clear?” }
            correct: true
            info:
              de: Der Weg vor Kiko ist frei oder nicht. Es ist das Gegenteil von „Wand voraus?“.
              en: The way ahead of Kiko is clear or not. It is the opposite of “wall ahead?”.
          - text: { de: „Wie weit ist die Wand?“, en: “How far is the wall?” }
            correct: false
            info:
              de: Darauf ist die Antwort eine Zahl, nicht wahr oder falsch. So einen Block hat Kiko nicht.
              en: The answer to that is a number, not true or false. Kiko has no such block.
        explanation:
          de: Eine Bedingung ist eine Frage mit der Antwort wahr oder falsch. Befehle und Fragen nach Zahlen sind keine Bedingungen.
          en: A condition is a question with the answer true or false. Commands and questions about numbers are not conditions.
      - type: true-false
        id: ohne-sonst
        text:
          de: "Programm: wenn Wand voraus? dann drehe dich nach rechts. Es gibt kein „sonst“. Vor Kiko ist frei. Stimmt es, dass Kiko dann nichts tut?"
          en: "Program: if wall ahead? then turn right. There is no “else”. The way ahead of Kiko is clear. Is it true that Kiko then does nothing?"
        answer: true
        explanation:
          de: Die Bedingung ist falsch, und ohne „sonst“ gibt es nichts zu tun. Das ist eine einseitige Verzweigung.
          en: The condition is false, and without “else” there is nothing to do. That is a one-sided selection.
  - type: section
    id: weiter
    title:
      de: Wie es weitergeht
      en: What comes next
    blocks:
      - type: text
        text:
          de: >-
            Du kannst jetzt mit „wenn … dann … sonst“ ein Programm bauen, das auf verschiedenen Spielfeldern klappt.
            **Jona** schreibt: „Mein Gang ist 9 Felder lang. Muss ich wirklich 9 Blöcke ziehen? 😩“ Auf der nächsten
            Seite lernst du, wie es kürzer geht.
          en: >-
            You can now build a program with “if … then … else” that works on different boards. **Jona** writes: “My
            corridor is 9 squares long. Do I really have to drag 9 blocks? 😩” On the next page you learn a shorter
            way.
