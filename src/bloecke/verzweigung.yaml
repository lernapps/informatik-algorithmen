# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Verzweigung
  en: Selection
description:
  de: "Mit „wenn … dann … sonst“ entscheidet Kiko je nach Bedingung, was er tut: ein Programm für verschiedene Spielfelder."
  en: "With “if … then … else” Kiko decides what to do depending on a condition: one program for different boards."
competencies: [verzweigung]
blocks:
  - type: section
    id: einstieg
    title:
      de: Wand oder keine Wand?
      en: Wall or no wall?
    blocks:
      - type: text
        text:
          de: |-
            Im Klassenchat der 7b:

            **Lea:** Woher soll Kiko wissen, ob vor ihm eine Wand ist?

            **Frau Berg:** Kiko hat Sensoren. Er kann fragen: „Wand voraus?“ Je nach Antwort macht er etwas anderes.

            **Jona:** Dann reicht ein Programm für alle Spielfelder? 😮

            Hier lernst du, wie ein Programm abhängig von einer Bedingung verschiedene Wege nimmt.
          en: |-
            In class 7b's group chat:

            **Lea:** How is Kiko supposed to know if there's a wall in front of it?

            **Frau Berg:** Kiko has sensors. It can ask: “wall ahead?” Depending on the answer, it does something different.

            **Jona:** So one program is enough for all the boards? 😮

            Here you learn how a program takes different paths depending on a condition.
      - type: single-choice
        id: spielfeld-b
        text:
          de: Kiko schaut im Bild nach rechts und führt das Programm auf Spielfeld 2 aus. Was passiert?
          en: Kiko faces right on the board and carries out the program on board 2. What happens?
        material:
          - type: figure
            image:
              de: images/kiko-verzweigung-programm-de.svg
              en: images/kiko-verzweigung-programm-en.svg
            alt:
              de: "Ein Programm: wenn Wand voraus? dann drehe dich nach rechts, sonst gehe vorwärts. Danach, außerhalb der Verzweigung: gehe vorwärts."
              en: "A program: if wall ahead? then turn right, else move forward. After that, outside the selection: move forward."
            caption:
              de: Das Programm. Der letzte Block steht nach der Verzweigung.
              en: The program. The last block comes after the selection.
            source:
              de: eigene Zeichnung nach lernapps.net/coding
              en: own drawing after lernapps.net/coding
            licence: CC-BY-4.0
          - type: figure
            image: images/kiko-verzweigung-b.svg
            alt:
              de: "Spielfeld 2: Kiko steht in Spalte 2, Zeile 2 und schaut im Bild nach rechts. Direkt vor ihm ist eine Wand. Unter ihm ist frei. Markiert sind A in Spalte 2, Zeile 3 und B in Spalte 2, Zeile 4."
              en: "Board 2: Kiko stands in column 2, row 2 and faces right on the board. Directly in front of it is a wall. Below it is free. Marked are A in column 2, row 3 and B in column 2, row 4."
            caption:
              de: Spielfeld 2
              en: Board 2
            source:
              de: eigene Zeichnung, Kiko nach lernapps.net/coding
              en: own drawing, Kiko after lernapps.net/coding
            licence: CC-BY-4.0
        options:
          - text: { de: Kiko endet auf Feld A., en: Kiko ends on square A. }
            correct: true
            info:
              de: "Wand voraus? Ja: Kiko dreht sich nach rechts und schaut im Bild nach unten. Dann der Block nach der Verzweigung: ein Feld vorwärts."
              en: "Wall ahead? Yes: Kiko turns right and faces down the board. Then the block after the selection: one square forward."
          - text: { de: Kiko endet auf Feld B., en: Kiko ends on square B. }
            correct: false
            info:
              de: Du hast beide Zweige ausgeführt. Kiko macht entweder „dann“ oder „sonst“, nie beides.
              en: You carried out both branches. Kiko does either “then” or “else”, never both.
          - text: { de: Kiko läuft gegen die Wand., en: Kiko walks into the wall. }
            correct: false
            info:
              de: Das wäre der „sonst“-Zweig. Die Bedingung ist aber wahr, also gilt der „dann“-Zweig.
              en: That would be the “else” branch. But the condition is true, so the “then” branch applies.
          - text: { de: Kiko dreht sich und bleibt auf seinem Feld., en: Kiko turns and stays on its square. }
            correct: false
            info:
              de: Du hast den letzten Block vergessen. Er steht nach der Verzweigung und wird immer ausgeführt.
              en: You forgot the last block. It comes after the selection and is always carried out.
        explanation:
          de: Die Bedingung „Wand voraus?“ ist wahr, also führt Kiko den „dann“-Zweig aus. Der Block danach gilt in jedem Fall.
          en: The condition “wall ahead?” is true, so Kiko carries out the “then” branch. The block after it applies in every case.
  - type: section
    id: idee
    title:
      de: Eine Frage, zwei Wege
      en: One question, two paths
    blocks:
      - type: text
        text:
          de: >-
            Der Block „Wand voraus?“ ist eine Bedingung: Kikos Sensor antwortet mit wahr oder falsch. Bei wahr
            führt Kiko die Blöcke nach „dann“ aus, bei falsch die nach „sonst“. Danach geht es mit dem nächsten Block
            weiter. Kiko kann auch fragen: „Weg frei?“ (das Gegenteil von „Wand voraus?“), „am Ziel?“, „Wand links?“
            und „Wand rechts?“.
          en: >-
            The block “wall ahead?” is a condition: Kiko's sensor answers true or false. If true, Kiko carries out the
            blocks after “then”, if false, those after “else”. After that it carries on with the next block. Kiko can
            also ask: “way ahead clear?” (the opposite of “wall ahead?”), “at the goal?”, “wall on the left?” and “wall
            on the right?”.
      - type: definition
        term:
          de: Sensor
          en: sensor
        explanation:
          de: "Ein Sensor ist der Teil von Kiko, der etwas prüft, zum Beispiel ob vor ihm eine Wand ist."
          en: "A sensor is the part of Kiko that checks something, for example whether there is a wall in front of it."
      - type: definition
        term:
          de: Bedingung
          en: condition
        explanation:
          de: Eine Bedingung ist eine Frage, auf die es nur die Antworten wahr oder falsch gibt (ja oder nein).
          en: A condition is a question that can only be answered with true or false (yes or no).
      - type: definition
        term:
          de: Verzweigung
          en: selection
        explanation:
          de: Eine Verzweigung (wenn … dann … sonst) legt fest, dass ein Algorithmus je nach Bedingung verschiedene Anweisungen ausführt.
          en: Selection (if … then … else) means that an algorithm carries out different instructions depending on a condition.
      - type: figure
        image: images/kiko-verzweigung-a.svg
        alt:
          de: "Spielfeld 1: Kiko steht in Spalte 2, Zeile 2 und schaut im Bild nach rechts. Vor ihm ist ein freier Gang bis Spalte 5."
          en: "Board 1: Kiko stands in column 2, row 2 and faces right on the board. In front of it is a free corridor up to column 5."
        caption:
          de: Spielfeld 1. Dasselbe Programm, aber hier ist keine Wand voraus.
          en: Board 1. The same program, but here there is no wall ahead.
        source:
          de: eigene Zeichnung, Kiko nach lernapps.net/coding
          en: own drawing, Kiko after lernapps.net/coding
        licence: CC-BY-4.0
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: >-
                Kiko führt immer nur einen Zweig aus. Teste ein Programm mit Verzweigung darum auf mehreren
                Spielfeldern, damit jeder Zweig einmal drankommt. Fehlt „sonst“ (einseitige Verzweigung),
                überspringt Kiko bei falsch den „dann“-Teil und macht mit dem nächsten Block weiter.
              en: >-
                Kiko only ever carries out one branch. So test a program with selection on several boards, so that
                every branch gets its turn. If there is no “else” (one-sided selection), Kiko skips the “then” part when the answer is false and carries on with the next block.
  - type: section
    id: ausprobieren
    title:
      de: Selbst ausprobieren
      en: Try it yourself
    blocks:
      - type: text
        text:
          de: |-
            **Ohne Computer:** Legt mit den [Karten für Entscheidungen](https://lernapps.net/coding/karten/de/befehlskarten-2.svg) „wenn ___ dann“, „sonst“ und „Wand voraus?“ ein Programm. Kiko spielt es zweimal: einmal mit einer Wand vor sich, einmal ohne.

            **Mit Computer:** Das Ziel ist mal im Bild oben, mal unten. Bau ein Programm, das auf beiden Spielfeldern klappt; die Werkstatt nennt sie „Rätsel“. Du brauchst dafür „Wand links?“: [Challenge „Oben oder unten?“ öffnen](https://lernapps.net/coding/app/?c=fVRBbus2EL3KgNnKTttFF9oEDYoCRYu2gNsGSJAFJY4kQtRQHY6s_gQGfBD_LnuKv-tNfJJ2KNtxFr_aSBxxZt7jvMdX00QerJjyy8J4Z0rT-z6uZiRapUhJTGHES0BTvhqHpjQ_V0gQHTJMJEh3pjBIpjS_jRAZXJzpzuwKIzb1l5wffB-hxU4APcF3GBxsoxZwkETDzhLlEHpChgdLbg3f2gSPHgP4JDDYAH6Aex8cxAqpeBfJUNZwb6fc4ReOLdthgMELHPd_KR047v9e-uhH5nbcHwpwNoEnqNA7JNiMHkODwSET9MGOo6zPDDOLIW4xQSSE9MdkGaGJPFt2YMmBdEiQxJLLNRuOJBAbsDDbENbwa4fQRsWdIMUBxQ-YYBo1Eapo2RVXcT3Ltz9ruJ-UqoVxYQezlw6O-4NvMqXcXD8wJDzuP4J0VmCO3CteqOJ_u3OltNYBzZGD0wnJh1FnFGz1gT1JZwqzRU4-UhZFHanxrW4c7GjKJ3OjjynMzc3j8t6sT2uNPxemsbWn1pQGbRKzUzHEGKr4p2Zv9biQJZnCBE-9vhnrLgfeyW625FbnLXlx2vdcmCSWxZQ0haBlBi9JEVYh1n0y5de6A8dkyq--0PaY9P_T6_-QuZB4vCaz2z0Xpu4wV30yLx7DCpnR151CrJAmeZFV7lteoX8uTOfp1DRbYFN3dgLneVHatdDA0hoeVIZJVNEvM3pBUkUhp4vBfoyxByvvBgkPOmOfwPmmQUaV26KZhHUkp0JVO55A_GTrDhwOgJy0w6bu2ItAw7YVUH2Xahe1H-STvzvuD-f-3zSCnGs3npOoc8ciJ4FNfdLMg8r8jCBgI3fH_ce39g9qw1w3-zzbXEkX4FhvgVwr-boDUqDLuIvFq0soJ-vNkFcU6y77_cTj4tTvG0XAqCezeO8a1Am0TEwJ2LedFNkz-Wc2KWWDD5Exs1wblcHW42xK1RjWPer0bZ2vuInD5aa79bRcqL5f2dBG9tINSLenrNstso63nai9PaP9XM7n0naFmhXfmj5O_M-nuoeXiWGj2tEh_v6WcjXEe1v3IDGfxWhb3XnYYMBafKQ8rN3uXw)
