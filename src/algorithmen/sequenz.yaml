# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Sequenz
  en: Sequence
description:
  de: "Befehle nacheinander in fester Reihenfolge: Mit drei Befehlskarten steuerst du Kiko über das Spielfeld."
  en: "Commands one after another in a fixed order: with three command cards you steer Kiko across the board."
competencies: [sequenz]
blocks:
  - type: section
    id: einstieg
    title:
      de: Mia ist Kiko
      en: Mia is Kiko
    blocks:
      - type: text
        text:
          de: |-
            Im Klassenchat der 7b, am Abend vor Informatik:

            **Frau Berg:** Morgen kleben wir ein Spielfeld auf den Boden. Eine oder einer von euch ist Kiko. Es gibt nur noch drei Karten: vorwärts, links drehen, rechts drehen.

            **Mia:** Ich bin Kiko!

            **Jona:** Dann lege ich die Karten. Mia, du machst genau, was draufsteht 😄

            Hier lernst du, Kiko mit drei Befehlen ans Ziel zu bringen, erst mit Karten, dann in der Werkstatt.
          en: |-
            In class 7b's group chat, the evening before computing:

            **Frau Berg:** Tomorrow we'll tape a board on the floor. One of you will be Kiko. There are only three cards left: forward, turn left, turn right.

            **Mia:** I'll be Kiko!

            **Jona:** Then I'll lay the cards. Mia, you do exactly what they say 😄

            Here you learn to bring Kiko to the goal with three commands, first with cards, then in the workshop.
      - type: single-choice
        id: wo-steht-kiko
        text:
          de: Kiko schaut nach rechts, das gelbe Dreieck zeigt die Blickrichtung. Jona legt die drei Karten. Auf welchem Feld steht Kiko danach?
          en: Kiko faces right; the yellow triangle shows which way it is facing. Jona lays the three cards. Which square is Kiko on afterwards?
        material:
          - type: figure
            image: images/kiko-sequenz-einstieg.svg
            alt:
              de: "Ein Spielfeld mit Spalten 1 bis 7 und Zeilen 1 bis 6. Kiko steht in Spalte 2, Zeile 4 und schaut nach rechts. Markiert sind A in Spalte 3, Zeile 2; B in Spalte 3, Zeile 3; C in Spalte 2, Zeile 2; D in Spalte 3, Zeile 5."
              en: "A board with columns 1 to 7 and rows 1 to 6. Kiko stands in column 2, row 4 and faces right. Marked are A in column 3, row 2; B in column 3, row 3; C in column 2, row 2; D in column 3, row 5."
            caption:
              de: Das Spielfeld. Dunkle Felder sind Wände.
              en: The board. Dark squares are walls.
            source:
              de: eigene Zeichnung, Kiko nach lernapps.net/coding
              en: own drawing, Kiko after lernapps.net/coding
            licence: CC-BY-4.0
          - type: figure
            image:
              de: images/kiko-sequenz-einstieg-karten-de.svg
              en: images/kiko-sequenz-einstieg-karten-en.svg
            alt:
              de: "Drei Karten untereinander: 1 gehe vorwärts, 2 drehe dich nach links, 3 gehe vorwärts."
              en: "Three cards, one below the other: 1 move forward, 2 turn left, 3 move forward."
            caption:
              de: Jonas Karten, von oben nach unten
              en: Jona's cards, from top to bottom
            source:
              de: eigene Zeichnung
              en: own drawing
            licence: CC-BY-4.0
        options:
          - text: { de: Feld A, en: Square A }
            correct: false
            info:
              de: Du hast das Drehen als Schritt gezählt. Beim Drehen bleibt Kiko auf seinem Feld.
              en: You counted the turn as a step. When Kiko turns, it stays on its square.
          - text: { de: Feld B, en: Square B }
            correct: true
            info:
              de: "Richtig: ein Feld nach rechts, dann nach oben drehen, dann ein Feld nach oben."
              en: "Right: one square to the right, then turn to face up, then one square up."
          - text: { de: Feld C, en: Square C }
            correct: false
            info:
              de: So wäre es, wenn Kiko sich zuerst dreht. Die erste Karte ist aber „gehe vorwärts“.
              en: That would happen if Kiko turned first. But the first card is “move forward”.
          - text: { de: Feld D, en: Square D }
            correct: false
            info:
              de: Du hast links und rechts verwechselt. Kiko schaut nach rechts. Dreht er sich nach links, schaut er nach oben.
              en: You mixed up left and right. Kiko faces right. If it turns left, it faces up.
        explanation:
          de: "Vorwärts auf Spalte 3, Zeile 4. Links drehen: Kiko schaut nach oben. Vorwärts auf Spalte 3, Zeile 3."
          en: "Forward to column 3, row 4. Turn left: Kiko faces up. Forward to column 3, row 3."
  - type: section
    id: idee
    title:
      de: Drei Befehle in fester Reihenfolge
      en: Three commands in a fixed order
    blocks:
      - type: text
        text:
          de: >-
            Kiko steht auf einem Feld und schaut in eine Richtung. Er kennt drei Befehle: **gehe vorwärts** (ein Feld
            weiter) sowie **drehe dich nach links** und **drehe dich nach rechts** (eine Vierteldrehung auf der
            Stelle). Ein Befehl ist eine Anweisung, die Kiko ohne Nachfragen ausführt.
          en: >-
            Kiko stands on a square and faces one way. It knows three commands: **move forward** (one square on) and
            **turn left** and **turn right** (a quarter turn on the spot). A command is an instruction that Kiko
            carries out without asking.
      - type: definition
        term:
          de: Sequenz
          en: sequence
        explanation:
          de: Eine Sequenz ist eine Folge von Anweisungen, die nacheinander ausgeführt werden, jede genau einmal, in der Reihenfolge, in der sie aufgeschrieben sind.
          en: A sequence is a series of instructions that are carried out one after another, each exactly once, in the order in which they are written.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: >-
                Drehen ändert nur die Blickrichtung, Kiko bleibt auf dem Feld. Links und rechts gelten aus Kikos
                Sicht. Und die Reihenfolge zählt: Erst drehen, dann gehen führt woandershin als erst gehen, dann
                drehen.
              en: >-
                Turning only changes the direction Kiko faces; it stays on its square. Left and right are from
                Kiko's point of view. And the order matters: turning first, then moving leads somewhere else than
                moving first, then turning.
  - type: section
    id: ausprobieren
    title:
      de: Selbst ausprobieren
      en: Try it yourself
    blocks:
      - type: text
        text:
          de: |-
            **Ohne Computer, zu dritt oder zu viert:**

            1. Druckt das [Spielfeld](https://lernapps.net/coding/karten/de/spielfeld.svg) und die [Befehlskarten](https://lernapps.net/coding/karten/de/befehlskarten-1.svg) aus oder klebt ein Spielfeld mit Klebeband auf den Boden.
            2. Legt Kiko, das Ziel und ein paar Wände aus.
            3. Ein Kind legt die Karten untereinander.
            4. Ein Kind ist Kiko und folgt den Karten von oben nach unten, genau wie sie daliegen.
            5. Kommt Kiko nicht ans Ziel, sucht gemeinsam die falsche Karte. Dann tauscht die Rollen.

            **Mit Computer:** In der Werkstatt werden die Karten zu Blöcken mit denselben Wörtern. Bring Kiko zum Ball: [Challenge „Kiko holt den Ball“ öffnen](https://lernapps.net/coding/app/?c=dVTBctw2DP0VDPeqlSc56hY39SU9ZNK0nbHHB4qCRFQkuAGh3diZ_Zt8Rm_-sQ4p7cY5RBeBBPHwiAfwmxmTRKume9MYGkxnZprTPuOXBfl5n51fgk-jaYySBjTdNzOg6cwHmhP4FBQGZLi1IZjGIF88I6rzmEE9Ql-c58aozfM1_j1KjYJAOClQhHvC0MIfOMFACLc4og8IxHUp5LzShPAJySOPKUzYwGAjKdSEyTPCX_GEEzwvcYWeU4zarv7svF0UbIR3PFqegK3zIOi85vZC_fPGFiiD1Up-Sja08HFZVy7FaHnIhVZZC01eIcmAAjmBervRmVAzaLreH06kPhUCMKCmRVp4t0JmtaLNGjVah3kFbUvFTknCUEqmT4dStGD7JyFWbxpzRMmUuOrmEo80lYPRHkz3YHbrZxqz-7NtN2u3e2W17WbtdvdXa7czj40ZrSOeTGfQZjXnolxKoU9fC_IxycmiaDaNCcRz-a9VLKH1MqbjJYTijqS5sOpDcnM23Zu3BQxz2X14bIzzWPcfzDNh2KMIFp0Lkieup7Z2ubNeaqf9gxOgZIWi_IAR7ognlCpnC_cv332oDXOHoYjSU4bnRWoIMnxY5IhXue-oAKlYh1WKg1VfhYKntAiMFbmF39LCm1ZfFiuYYTlctB0rRI88FME2sn8ngX-xpK_5YBD0W19kKjTfC3pk6PFUe98zcLk3HFOsxNufZkkX4Qw9jkkQsLRtzQefF2HiCYaEGTgpxHREIIU0jkCaN7qviJWhW9u_g7f7aAMUOV--i-YyTMzbQFTGyD_NRZW2g7HoLwPoiRw2pQZcCV679rExR8KT6Yrq6GY0jemtq5O_SLg-ADfE68tD896GKQmpj8g3r-3tFbq58PhVzK_Czk0ZGfyR9H6Rl__cXJ-I378egiVGuaDfWjdfdMWr83w-_w8)
          en: |-
            **Without a computer, in threes or fours:**

            1. Print the [board](https://lernapps.net/coding/karten/en/spielfeld.svg) and the [command cards](https://lernapps.net/coding/karten/en/befehlskarten-1.svg), or tape a board on the floor.
            2. Put out Kiko, the goal and a few walls.
            3. One person lays the cards one below the other.
            4. One person is Kiko and follows the cards from top to bottom, exactly as they lie.
            5. If Kiko misses the goal, find the wrong card together. Then swap roles.

            **With a computer:** in the workshop, the cards become blocks with the same words. Bring Kiko to the ball: [open the challenge “Kiko fetches the ball”](https://lernapps.net/coding/en/app/?c=dVTBctw2DP0VDPeqlSc56hY39SU9ZNK0nbHHB4qCRFQkuAGh3diZ_Zt8Rm_-sQ4p7cY5RBeBBPHwiAfwmxmTRKume9MYGkxnZprTPuOXBfl5n51fgk-jaYySBjTdNzOg6cwHmhP4FBQGZLi1IZjGIF88I6rzmEE9Ql-c58aozfM1_j1KjYJAOClQhHvC0MIfOMFACLc4og8IxHUp5LzShPAJySOPKUzYwGAjKdSEyTPCX_GEEzwvcYWeU4zarv7svF0UbIR3PFqegK3zIOi85vZC_fPGFiiD1Up-Sja08HFZVy7FaHnIhVZZC01eIcmAAjmBervRmVAzaLreH06kPhUCMKCmRVp4t0JmtaLNGjVah3kFbUvFTknCUEqmT4dStGD7JyFWbxpzRMmUuOrmEo80lYPRHkz3YHbrZxqz-7NtN2u3e2W17WbtdvdXa7czj40ZrSOeTGfQZjXnolxKoU9fC_IxycmiaDaNCcRz-a9VLKH1MqbjJYTijqS5sOpDcnM23Zu3BQxz2X14bIzzWPcfzDNh2KMIFp0Lkieup7Z2ubNeaqf9gxOgZIWi_IAR7ognlCpnC_cv332oDXOHoYjSU4bnRWoIMnxY5IhXue-oAKlYh1WKg1VfhYKntAiMFbmF39LCm1ZfFiuYYTlctB0rRI88FME2sn8ngX-xpK_5YBD0W19kKjTfC3pk6PFUe98zcLk3HFOsxNufZkkX4Qw9jkkQsLRtzQefF2HiCYaEGTgpxHREIIU0jkCaN7qviJWhW9u_g7f7aAMUOV--i-YyTMzbQFTGyD_NRZW2g7HoLwPoiRw2pQZcCV679rExR8KT6Yrq6GY0jemtq5O_SLg-ADfE68tD896GKQmpj8g3r-3tFbq58PhVzK_Czk0ZGfyR9H6Rl__cXJ-I378egiVGuaDfWjdfdMWr83w-_w8)
      - type: figure
        image: images/kiko-challenge-sequenz-schulhof.svg
        alt:
          de: "Das Spielfeld der Challenge: Kiko steht in Spalte 2, Zeile 2 und schaut nach rechts. Ein Weg führt 2 Felder nach rechts, 2 nach unten, 2 nach rechts und 1 nach unten zum Ziel in Spalte 6, Zeile 5."
          en: "The board of the challenge: Kiko stands in column 2, row 2 and faces right. A path leads 2 squares right, 2 down, 2 right and 1 down to the goal in column 6, row 5."
        caption:
          de: So sieht die Challenge in der Werkstatt aus.
          en: This is what the challenge looks like in the workshop.
        source:
          de: eigene Zeichnung, Kiko nach lernapps.net/coding
          en: own drawing, Kiko after lernapps.net/coding
        licence: CC-BY-4.0
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: number
        id: karten-zaehlen
        text:
          de: Wie viele Karten braucht Kiko auf diesem Spielfeld mindestens, um ins Ziel zu kommen?
          en: What is the smallest number of cards Kiko needs on this board to reach the goal?
        material:
          - type: figure
            image: images/kiko-sequenz-zaehlen.svg
            alt:
              de: "Kiko steht in Spalte 2, Zeile 2 und schaut nach rechts. Der Weg führt 3 Felder nach rechts, 2 nach unten, 1 nach rechts und 1 nach unten zum Ziel in Spalte 6, Zeile 5."
              en: "Kiko stands in column 2, row 2 and faces right. The path leads 3 squares right, 2 down, 1 right and 1 down to the goal in column 6, row 5."
            caption:
              de: Jedes Feld vorwärts und jede Drehung ist eine Karte.
              en: Every square forward and every turn is one card.
            source:
              de: eigene Zeichnung, Kiko nach lernapps.net/coding
              en: own drawing, Kiko after lernapps.net/coding
            licence: CC-BY-4.0
        answer: 10
        tolerance: 0
        mistakes:
          - answer: 7
            message:
              de: Du hast nur die Felder gezählt. Jede Drehung ist auch eine Karte.
              en: You only counted the squares. Every turn is a card too.
          - answer: 9
            message:
              de: "Zähl die Drehungen noch einmal: An jeder der drei Kurven dreht Kiko sich."
              en: "Count the turns again: Kiko turns at each of the three bends."
        explanation:
          de: "7 Karten „gehe vorwärts“ und 3 Drehungen: rechts, links, rechts."
          en: "7 “move forward” cards and 3 turns: right, left, right."
      - type: single-choice
        id: welche-folge
        text:
          de: Kiko schaut nach oben. Welche Folge bringt ihn ins Ziel?
          en: Kiko faces up. Which sequence takes it to the goal?
        material:
          - type: figure
            image: images/kiko-sequenz-auswahl.svg
            alt:
              de: "Kiko steht in Spalte 2, Zeile 4 und schaut nach oben. Der Weg führt 2 Felder nach oben und dann 3 Felder nach rechts zum Ziel in Spalte 5, Zeile 2."
              en: "Kiko stands in column 2, row 4 and faces up. The path leads 2 squares up and then 3 squares right to the goal in column 5, row 2."
            caption:
              de: Ein Weg mit einer Kurve
              en: A path with one bend
            source:
              de: eigene Zeichnung, Kiko nach lernapps.net/coding
              en: own drawing, Kiko after lernapps.net/coding
            licence: CC-BY-4.0
        options:
          - text:
              de: vorwärts, vorwärts, rechts, vorwärts, vorwärts, vorwärts
              en: forward, forward, right, forward, forward, forward
            correct: true
            info:
              de: "Richtig: 2 Felder hoch, an der Kurve nach rechts drehen, 3 Felder bis zum Ziel."
              en: "Right: 2 squares up, turn right at the bend, 3 squares to the goal."
          - text:
              de: vorwärts, vorwärts, links, vorwärts, vorwärts, vorwärts
              en: forward, forward, left, forward, forward, forward
            correct: false
            info:
              de: Nach links schaut Kiko gegen die Wand. Aus seiner Sicht liegt das Ziel rechts.
              en: Turning left makes Kiko face the wall. From its point of view the goal is on the right.
          - text:
              de: vorwärts, vorwärts, vorwärts, rechts, vorwärts, vorwärts
              en: forward, forward, forward, right, forward, forward
            correct: false
            info:
              de: Beim dritten „vorwärts“ läuft Kiko gegen die Wand. Die Kurve kommt schon nach 2 Feldern.
              en: On the third “forward” Kiko walks into the wall. The bend comes after 2 squares.
          - text:
              de: rechts, vorwärts, vorwärts, vorwärts, vorwärts, vorwärts
              en: right, forward, forward, forward, forward, forward
            correct: false
            info:
              de: Die Karten stimmen, die Reihenfolge nicht. Dreht Kiko sich zuerst, läuft er gegen die Wand.
              en: The cards are right, the order is not. If Kiko turns first, it walks into the wall.
        explanation:
          de: Erst geradeaus bis zur Kurve, dann drehen, dann weiter.
          en: First straight on to the bend, then turn, then on.
      - type: generated
        id: hin-und-zurueck
        given:
          a: { int: [3, 9] }
          b: { int: [1, 8] }
        where: ["b < a", "a != 2 * b"]
        task:
          text:
            de: "Kiko steht in einem langen, geraden Gang. Er geht {{a}}-mal vorwärts, dreht sich zweimal nach rechts und geht {{b}}-mal vorwärts. Wie viele Felder ist Kiko jetzt von seinem Startfeld entfernt?"
            en: "Kiko is in a long, straight corridor. It moves forward {{a}} times, turns right twice and moves forward {{b}} times. How many squares is Kiko away from its starting square now?"
        answer: { value: "a - b", compare: { number: { format: integer } } }
        mistakes:
          - value: "a + b"
            message:
              de: "Zweimal rechts drehen ist eine halbe Drehung: Danach schaut Kiko zurück. Die {{b}} Schritte gehen also zurück zum Start."
              en: "Turning right twice is a half turn: afterwards Kiko faces back. So the {{b}} steps go back towards the start."
          - value: "b"
            message:
              de: Das sind nur die Schritte nach dem Drehen. Kiko war vorher schon {{a}} Felder weit gegangen.
              en: Those are only the steps after turning. Before that, Kiko had already gone {{a}} squares.
        hint:
          de: Zeichne den Gang auf und setz Kiko Schritt für Schritt weiter. Wohin schaut er nach zwei Rechtsdrehungen?
          en: Draw the corridor and move Kiko step by step. Which way does it face after two right turns?
        steps:
          - de: "Nach {{a}}-mal vorwärts ist Kiko {{a}} Felder vom Start entfernt."
            en: "After moving forward {{a}} times, Kiko is {{a}} squares from the start."
          - de: "Zwei Vierteldrehungen nach rechts sind eine halbe Drehung. Kiko schaut jetzt zum Start zurück."
            en: "Two quarter turns to the right make a half turn. Kiko now faces back towards the start."
          - de: "Er geht {{b}} Felder zurück: {{a}} − {{b}} = {{answer}} Felder vom Start."
            en: "It goes {{b}} squares back: {{a}} − {{b}} = {{answer}} squares from the start."
      - type: true-false
        id: drehen-ist-schritt
        text:
          de: "Selin sagt: „Die Karte ‚drehe dich nach links‘ bringt Kiko ein Feld nach links.“ Stimmt das?"
          en: "Selin says: “The card ‘turn left’ takes Kiko one square to the left.” Is that true?"
        answer: false
        explanation:
          de: Drehen bewegt Kiko nicht vom Feld. Erst „gehe vorwärts“ bringt ihn auf das Feld links von ihm.
          en: Turning does not move Kiko off its square. Only “move forward” takes it to the square on its left.
  - type: section
    id: weiter
    title:
      de: Rückblick und wie es weitergeht
      en: Looking back and what comes next
    blocks:
      - type: text
        text:
          de: >-
            In diesem Kapitel hast du Algorithmen im Alltag gefunden, ihre Eigenschaften geprüft und Kiko mit einer
            Sequenz ans Ziel gebracht. **Mia** schreibt nach der Stunde: „Mir ist schwindelig. Kann das nicht Kiko
            machen?“ Im nächsten Kapitel werden aus den Karten Blöcke, und Kiko führt das Programm selbst aus.
          en: >-
            In this chapter you found algorithms in everyday life, checked their properties and brought Kiko to the
            goal with a sequence. After the lesson **Mia** writes: “I'm dizzy. Can't Kiko do that?” In the next
            chapter the cards become blocks, and Kiko carries out the program itself.
