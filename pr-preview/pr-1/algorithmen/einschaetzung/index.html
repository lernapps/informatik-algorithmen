<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../algorithmen/">Was ist ein Algorithmus?</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 7 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Texte sind Algorithmen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>ein Rezept für Pfannkuchen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>die Bauanleitung für ein Regal</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>der Wetterbericht für morgen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="3"> <span>der Stundenplan der 7b</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="4"> <span>die Anleitung zum Anmelden im Schul-WLAN</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Rezept für Pfannkuchen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein Rezept sagt Schritt für Schritt, was du tun sollst, bis die Pfannkuchen fertig sind.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>die Bauanleitung für ein Regal</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Bauanleitung führt in nummerierten Schritten zum fertigen Regal.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>der Wetterbericht für morgen</strong></p><p>Der Wetterbericht beschreibt, wie das Wetter wird. Er sagt nicht, was jemand tun soll, darum ist er keine Handlungsvorschrift.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>der Stundenplan der 7b</strong></p><p>Der Stundenplan zeigt, wann welches Fach ist. Schritte, die eine Aufgabe lösen, enthält er nicht.</p></li>
<li class="question-info question-info-right" data-option="4"><p class="question-info-head"><strong>die Anleitung zum Anmelden im Schul-WLAN</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Sie sagt Schritt für Schritt, was du tippen und anklicken sollst, bis du im WLAN bist.</p></li>
</ul>
<p class="question-explanation">Ein Algorithmus sagt, was zu tun ist, in Schritten, bis eine Aufgabe gelöst ist. Eine Beschreibung oder eine Übersicht reicht dafür nicht.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aufgabe löst welcher Algorithmus?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Rezept</span> <select name="frage-a2-0" data-left="0"><option value="">bitte wählen</option><option value="3">große Zahlen addieren</option><option value="0">einen Kuchen backen</option><option value="1">ein Regal aufbauen</option><option value="2">einen Raum finden</option></select></label></li>
<li><label><span>Bauanleitung</span> <select name="frage-a2-1" data-left="1"><option value="">bitte wählen</option><option value="3">große Zahlen addieren</option><option value="0">einen Kuchen backen</option><option value="1">ein Regal aufbauen</option><option value="2">einen Raum finden</option></select></label></li>
<li><label><span>Wegbeschreibung</span> <select name="frage-a2-2" data-left="2"><option value="">bitte wählen</option><option value="3">große Zahlen addieren</option><option value="0">einen Kuchen backen</option><option value="1">ein Regal aufbauen</option><option value="2">einen Raum finden</option></select></label></li>
<li><label><span>schriftliches Addieren</span> <select name="frage-a2-3" data-left="3"><option value="">bitte wählen</option><option value="3">große Zahlen addieren</option><option value="0">einen Kuchen backen</option><option value="1">ein Regal aufbauen</option><option value="2">einen Raum finden</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Rezept – einen Kuchen backen; Bauanleitung – ein Regal aufbauen; Wegbeschreibung – einen Raum finden; schriftliches Addieren – große Zahlen addieren</p>
<p class="question-explanation">Jeder Algorithmus gehört zu einer Aufgabe. Er ist fertig, wenn die Aufgabe gelöst ist.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Eigenschaft fehlt der Anleitung?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>„Rühre, bis es gut aussieht.“</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">nicht endlich beschrieben</option><option value="0">nicht eindeutig</option><option value="2">endet nicht</option><option value="1">nicht ausführbar</option></select></label></li>
<li><label><span>„Flieg aus dem Fenster zum Schulhof.“</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">nicht endlich beschrieben</option><option value="0">nicht eindeutig</option><option value="2">endet nicht</option><option value="1">nicht ausführbar</option></select></label></li>
<li><label><span>„Zähl 1, 2, 3 und so weiter und hör nie auf.“</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">nicht endlich beschrieben</option><option value="0">nicht eindeutig</option><option value="2">endet nicht</option><option value="1">nicht ausführbar</option></select></label></li>
<li><label><span>Ein Zettel, auf dem die Schritte nie aufhören: Schritt 1, Schritt 2, …</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">nicht endlich beschrieben</option><option value="0">nicht eindeutig</option><option value="2">endet nicht</option><option value="1">nicht ausführbar</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> „Rühre, bis es gut aussieht.“ – nicht eindeutig; „Flieg aus dem Fenster zum Schulhof.“ – nicht ausführbar; „Zähl 1, 2, 3 und so weiter und hör nie auf.“ – endet nicht; Ein Zettel, auf dem die Schritte nie aufhören: Schritt 1, Schritt 2, … – nicht endlich beschrieben</p>
<p class="question-explanation">„Gut aussehen“ versteht jeder anders. Fliegen kann niemand. Wer nie aufhört zu zählen, ist nie fertig. Und ein Zettel ohne Ende lässt sich gar nicht aufschreiben.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Karten kann Kiko auf dem Spielfeld ausführen, ohne zu raten?</legend>
<label class="question-option"><input type="checkbox" name="frage-a4" value="0"> <span>„gehe vorwärts“</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="1"> <span>„gehe ein paar Felder“</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="2"> <span>„drehe dich nach rechts“</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="3"> <span>„fliege zum Ziel“</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="4"> <span>„drehe dich nach links“</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>„gehe vorwärts“</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genau ein Feld in Blickrichtung. Das ist klar und machbar.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>„gehe ein paar Felder“</strong></p><p>Wie viele sind „ein paar“? Die Karte ist nicht eindeutig.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>„drehe dich nach rechts“</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine Vierteldrehung auf der Stelle. Das ist klar und machbar.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>„fliege zum Ziel“</strong></p><p>Kiko kann nicht fliegen. Die Karte ist nicht ausführbar.</p></li>
<li class="question-info question-info-right" data-option="4"><p class="question-info-head"><strong>„drehe dich nach links“</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine Vierteldrehung auf der Stelle, nur andersherum. Auch das ist klar und machbar.</p></li>
</ul>
<p class="question-explanation">Kiko kennt drei Befehle. Jede Karte, die genau einen davon meint, kann er ohne Raten ausführen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Karten braucht Kiko auf diesem Spielfeld mindestens, um ins Ziel zu kommen?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit"><img src="../../images/kiko-sequenz-zaehlen.svg" alt="Kiko steht in Spalte 2, Zeile 5 und schaut im Bild nach rechts. Der Weg führt 1 Feld nach rechts, 3 nach oben und 3 nach rechts zum Ziel in Spalte 6, Zeile 2." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung, Kiko nach lernapps.net/coding. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung, Kiko nach lernapps.net/coding. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Jedes Feld vorwärts und jede Drehung ist eine Karte.</p></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a5">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 9</p>
<p class="question-explanation">7 Karten „gehe vorwärts“ und 2 Drehungen: links, dann rechts.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
