<p>With this self-assessment, 8 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>

<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko faces right on the board. Which square is it on when the program has finished?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit"><img src="../../../images/kiko-bloecke-wo.svg" alt="A board with columns 1 to 7 and rows 1 to 7. Kiko stands in column 2, row 6 and faces right on the board. Marked are A in column 5, row 3; B in column 4, row 4; C in column 3, row 4; D in column 4, row 5." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Source: own drawing, Kiko after lernapps.net/coding. Licence: CC-BY-4.0." aria-label="Source: own drawing, Kiko after lernapps.net/coding. Licence: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>The board. Dark squares are walls.</p></figcaption></figure><figure class="block-figure"><div class="block-image-credit"><img src="../../../images/kiko-bloecke-wo-programm-en.svg" alt="A program of blocks under the head “Program”: move forward, turn left, move forward, move forward, turn right, move forward." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Source: own drawing after lernapps.net/coding. Licence: CC-BY-4.0." aria-label="Source: own drawing after lernapps.net/coding. Licence: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Ben&#39;s program. Kiko carries out the blocks from top to bottom.</p></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Square A</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Square B</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Square C</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>Square D</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Square A</strong></p><p>You counted every turn as a step. When Kiko turns, it stays on its square.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Square B</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Right: one square to the right, two squares up, then one more square to the right.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Square C</strong></p><p>You stopped counting before the last block. After “turn right” there is one more “move forward”.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Square D</strong></p><p>You skipped a block. After turning left, Kiko moves forward twice.</p></li>
</ul>
<p class="question-explanation">A program is carried out block by block, just like the cards. Kiko ends in column 4, row 4.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko faces right on the board and has to move 3 squares forward, turn left and move 2 squares forward. How many blocks does the program have, not counting the head “Program”?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a2">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 6</p>
<p class="question-explanation">3 times “move forward”, once “turn left” and 2 times “move forward”: 6 blocks in all.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>

<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Next</button></p>

<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko carries out this program in a free corridor with no wall in front of it: if wall ahead? then turn right, else move forward. After that: move forward. How many squares does Kiko move?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 2</p>
<p class="question-explanation">No wall ahead: Kiko takes the “else” branch and moves one square. The block after the selection takes it one more square.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Program: if way ahead clear? then move forward, else turn left. What does Kiko do?</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>The way ahead of Kiko is clear.</span> <select name="frage-a4-0" data-left="0"><option value="">please choose</option><option value="1">turn left</option><option value="2">forward and left</option><option value="0">one square forward</option><option value="3">nothing at all</option></select></label></li>
<li><label><span>There is a wall in front of Kiko.</span> <select name="frage-a4-1" data-left="1"><option value="">please choose</option><option value="1">turn left</option><option value="2">forward and left</option><option value="0">one square forward</option><option value="3">nothing at all</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> The way ahead of Kiko is clear. – one square forward; There is a wall in front of Kiko. – turn left</p>
<p class="question-explanation">If the way is clear, “then” applies, otherwise “else”. Both branches together never happen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
