<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../bloecke/">Programmieren mit Blöcken</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 4</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko schaut im Bild nach rechts. Auf welchem Feld steht er, wenn das Programm fertig ist?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit"><img src="../../images/kiko-bloecke-wo.svg" alt="Ein Spielfeld mit Spalten 1 bis 7 und Zeilen 1 bis 7. Kiko steht in Spalte 2, Zeile 6 und schaut im Bild nach rechts. Markiert sind A in Spalte 5, Zeile 3; B in Spalte 4, Zeile 4; C in Spalte 3, Zeile 4; D in Spalte 4, Zeile 5." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung, Kiko nach lernapps.net/coding. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung, Kiko nach lernapps.net/coding. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Das Spielfeld. Dunkle Felder sind Wände.</p></figcaption></figure><figure class="block-figure"><div class="block-image-credit"><img src="../../images/kiko-bloecke-wo-programm-de.svg" alt="Ein Programm aus Blöcken unter dem Kopf „Programm“: gehe vorwärts, drehe dich nach links, gehe vorwärts, gehe vorwärts, drehe dich nach rechts, gehe vorwärts." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung nach lernapps.net/coding. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung nach lernapps.net/coding. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Bens Programm. Kiko führt die Blöcke von oben nach unten aus.</p></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Feld A</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Feld B</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Feld C</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>Feld D</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Feld A</strong></p><p>Du hast jede Drehung wie einen Schritt gezählt. Beim Drehen bleibt Kiko auf seinem Feld.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Feld B</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: ein Feld nach rechts, zwei Felder hoch, dann wieder ein Feld nach rechts.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Feld C</strong></p><p>Du hast vor dem letzten Block aufgehört zu zählen. Nach „drehe dich nach rechts“ kommt noch „gehe vorwärts“.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Feld D</strong></p><p>Du hast einen Block übersprungen. Nach dem Linksdrehen geht Kiko zweimal vorwärts.</p></li>
</ul>
<p class="question-explanation">Ein Programm wird Block für Block ausgeführt, genau wie die Karten. Kiko endet in Spalte 4, Zeile 4.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko schaut im Bild nach rechts und soll 3 Felder vorwärts, sich nach links drehen und 2 Felder vorwärts gehen. Aus wie vielen Blöcken besteht das Programm, ohne den Kopf „Programm“?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a2">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 6</p>
<p class="question-explanation">3-mal „gehe vorwärts“, 1-mal „drehe dich nach links“ und 2-mal „gehe vorwärts“: zusammen 6 Blöcke.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 4</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kiko führt dieses Programm auf einem freien Gang aus, vor ihm ist keine Wand: wenn Wand voraus? dann drehe dich nach rechts, sonst gehe vorwärts. Danach: gehe vorwärts. Wie viele Felder geht Kiko?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 2</p>
<p class="question-explanation">Keine Wand voraus: Kiko nimmt den „sonst“-Zweig und geht ein Feld. Der Block nach der Verzweigung bringt ihn ein zweites Feld weiter.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Programm: wenn Weg frei? dann gehe vorwärts, sonst drehe dich nach links. Was tut Kiko?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Vor Kiko ist frei.</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">nach links drehen</option><option value="2">vorwärts und links</option><option value="0">ein Feld vorwärts</option><option value="3">gar nichts</option></select></label></li>
<li><label><span>Vor Kiko ist eine Wand.</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">nach links drehen</option><option value="2">vorwärts und links</option><option value="0">ein Feld vorwärts</option><option value="3">gar nichts</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Vor Kiko ist frei. – ein Feld vorwärts; Vor Kiko ist eine Wand. – nach links drehen</p>
<p class="question-explanation">Ist der Weg frei, gilt „dann“, sonst gilt „sonst“. Beide Zweige zusammen kommen nie vor.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
